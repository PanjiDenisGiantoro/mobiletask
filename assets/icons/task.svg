<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Task Checklist Icon</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Card Container -->
  <rect x="36" y="24" width="184" height="208" rx="24" fill="#FFFFFF" filter="url(#shadow)" stroke="#F1F5F9" stroke-width="2" />

  <!-- Row 1: Completed Task (Blue) -->
  <circle cx="76" cy="72" r="16" fill="#3B82F6" />
  <path d="M69 72 L74 77 L83 66" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="106" y="63" width="110" height="18" rx="9" fill="#1E293B" />

  <!-- Row 2: Completed Task (Teal) -->
  <circle cx="76" cy="128" r="16" fill="#14B8A6" />
  <path d="M69 128 L74 133 L83 122" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="106" y="119" width="90" height="18" rx="9" fill="#CBD5E1" />

  <!-- Row 3: Pending Task (Empty) -->
  <circle cx="76" cy="184" r="14.5" fill="none" stroke="#E2E8F0" stroke-width="3" />
  <rect x="106" y="175" width="90" height="18" rx="9" fill="#E2E8F0" />
</svg>
